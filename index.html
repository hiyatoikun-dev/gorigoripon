<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- ★ タイトルはここを好きな名前に変える -->
  <title>みんなで回せるガラポン</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root {
      --bg: #f2f2f7; /* iOSっぽい薄グレー */
      --card: #fff;
      --ink: #111;
      --accent: #2563eb; /* ほどよいブルー */
    }
    html, body { height: 100%; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Noto Sans JP, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,.08);
      padding: 16px;
    }
    header h1 { font-size: 20px; margin: 0 0 8px; }
    header p { margin: 0; color: #555; font-size: 14px; }

    /* キャンバスは横幅いっぱい・縦は画面の6割 */
    .stage { width: 100%; height: min(70vh, 560px); display: block; border-radius: 12px; background: #fafafa; }

    .ctrls { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 12px; }
    button.spin {
      font-size: 18px; line-height: 1; padding: 16px 18px; border-radius: 12px;
      border: none; background: var(--accent); color: #fff; font-weight: 700;
      box-shadow: 0 6px 14px rgba(37,99,235,.25); cursor: pointer; width: 100%;
    }
    button.spin:active { transform: translateY(1px); }

    .result {
      margin-top: 14px; padding: 14px; border-radius: 12px; background: #f8fafc; border: 1px solid #e5e7eb;
      font-size: clamp(18px, 4.5vw, 28px); font-weight: 800; text-align: center;
    }
    .notice { margin-top: 10px; color: #6b7280; font-size: 12px; text-align: center; }

    footer { opacity: .7; font-size: 12px; text-align: center; margin-top: 18px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="card">
      <h1>みんなで回せるガラポン</h1>
      <p>スマホ全画面＆横幅いっぱい。ホーム画面に追加すればアプリ風にも。</p>
    </header>

    <main class="card" style="margin-top:12px;">
      <!-- ガラポン描画用キャンバス（横幅100%、デバイス比スケーリング） -->
      <canvas id="stage" class="stage" aria-label="ガラポン" role="img"></canvas>

      <div class="ctrls">
        <button id="btnSpin" class="spin">回す（Spin）</button>
        <div id="result" class="result">結果：—</div>
        <div class="notice">※ 「回す」を押すと玉が回り、皿の下に結果が大きく表示されます。</div>
      </div>
    </main>

    <footer>
      <small>© 2025 Garapon Demo. 配布OK／改変OK（クレジット任意）</small>
    </footer>
  </div>

  <script>
    // ===== 画面スケーリング（横幅いっぱい & シャープな描画） =====
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    function fitCanvas() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const { clientWidth, clientHeight } = canvas;
      canvas.width = Math.floor(clientWidth * dpr);
      canvas.height = Math.floor(clientHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // CSSピクセル基準に戻す
      drawStatic();
    }

    window.addEventListener('resize', fitCanvas, { passive: true });
    window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 120), { passive: true });

    // ===== ガラポン静的パーツ（筐体・出口・皿など） =====
    function drawStatic() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);

      // ガラポン本体（六角形っぽい）
      ctx.save();
      ctx.translate(w*0.3, h*0.42);
      ctx.rotate(-0.15);
      hexagon(0, 0, Math.min(w, h)*0.22, '#d1d5db', '#111');
      // ハンドル
      ctx.beginPath();
      ctx.arc(0, 0, Math.min(w, h)*0.05, 0, Math.PI*2);
      ctx.fillStyle = '#9ca3af'; ctx.fill();
      ctx.restore();

      // 排出口（右下寄り）
      const ex = w*0.62, ey = h*0.56, er = Math.min(w, h)*0.03;
      ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI*2);
      ctx.fillStyle = '#111'; ctx.fill();

      // 受け皿（下部中央）
      const bx = w*0.5, by = h*0.85, brx = w*0.38, bry = h*0.07;
      roundRect(bx - brx/2, by - bry/2, brx, bry, 12, '#e5e7eb', '#9ca3af');
    }

    function hexagon(x, y, r, fill, stroke) {
      ctx.beginPath();
      for (let i=0; i<6; i++) {
        const a = Math.PI/3 * i;
        const px = x + r*Math.cos(a), py = y + r*Math.sin(a);
        i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
      }
      ctx.closePath();
      ctx.fillStyle = fill; ctx.fill();
      ctx.strokeStyle = stroke; ctx.stroke();
    }
    function roundRect(x, y, w, h, r, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x+r, y);
      ctx.arcTo(x+w, y,   x+w, y+h, r);
      ctx.arcTo(x+w, y+h, x,   y+h, r);
      ctx.arcTo(x,   y+h, x,   y,   r);
      ctx.arcTo(x,   y,   x+w, y,   r);
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke){ ctx.strokeStyle = stroke; ctx.stroke(); }
    }

    // ===== 粒子（玉） =====
    const balls = [];
    const colors = ['#ef4444','#f59e0b','#10b981','#3b82f6','#a855f7'];
    const rng = (a,b)=> a + Math.random()*(b-a);

    function resetBalls() {
      balls.length = 0;
      const n = 10;
      for (let i=0;i<n;i++) {
        balls.push({
          x: rng(canvas.clientWidth*0.22, canvas.clientWidth*0.38),
          y: rng(canvas.clientHeight*0.22, canvas.clientHeight*0.38),
          r: rng(8, 12),
          vx: rng(-2, 2),
          vy: rng(-1, 1),
          c: colors[i % colors.length],
          alive: true
        });
      }
    }

    // ===== 物理もどき（簡易反発＆出口&受け皿） =====
    let spinning = false, rafId = 0;
    const resultEl = document.getElementById('result');

    function step() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      // 重力
      for (const b of balls) {
        if (!b.alive) continue;
        b.vy += 0.15; // 重力
        b.x += b.vx;  b.y += b.vy;

        // 壁反射
        if (b.x < b.r) { b.x=b.r; b.vx*=-0.7; }
        if (b.x > w-b.r) { b.x=w-b.r; b.vx*=-0.7; }
        if (b.y < b.r) { b.y=b.r; b.vy*=-0.7; }

        // 受け皿（底）
        const floor = h*0.82;
        if (b.y > floor-b.r) { b.y = floor-b.r; b.vy *= -0.45; b.vx *= 0.98; }

        // 排出口位置付近に来たら吸い出し判定
        const ex = w*0.62, ey = h*0.56, er = Math.min(w,h)*0.03;
        const dx = b.x - ex, dy = b.y - ey;
        if (Math.hypot(dx,dy) < er*1.2) {
          // 出口から下へ落下→受け皿へ
          b.vx = rng(-0.5,0.5);
          b.vy = Math.abs(b.vy) + 4;
          b.x = ex; b.y = ey + er + 2;
        }
      }

      // 衝突（簡易）
      for (let i=0;i<balls.length;i++){
        for (let j=i+1;j<balls.length;j++){
          const a=balls[i], b=balls[j];
          if(!a.alive||!b.alive) continue;
          const dx=a.x-b.x, dy=a.y-b.y; const d=Math.hypot(dx,dy);
          const min=a.r+b.r;
          if(d>0 && d<min){
            const nx=dx/d, ny=dy/d;
            const overlap=min-d; a.x+=nx*overlap/2; a.y+=ny*overlap/2; b.x-=nx*overlap/2; b.y-=ny*overlap/2;
            // 反発（法線方向を入れ替える）
            const av=(a.vx*nx+a.vy*ny), bv=(b.vx*nx+b.vy*ny);
            const diff=bv-av; a.vx+=nx*diff; a.vy+=ny*diff; b.vx-=nx*diff; b.vy-=ny*diff;
          }
        }
      }

      draw();
      rafId = spinning ? requestAnimationFrame(step) : 0;
    }

    function draw(){
      drawStatic();
      for (const b of balls) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
        ctx.fillStyle = b.c; ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.12)'; ctx.stroke();
      }
    }

    // ===== 結果生成（例：色で賞を判定） =====
    function pickResult(){
      const idx = Math.floor(Math.random()*colors.length);
      const color = colors[idx];
      const label = {
        '#ef4444':'赤＝大当たり',
        '#f59e0b':'橙＝中当たり',
        '#10b981':'緑＝小当たり',
        '#3b82f6':'青＝参加賞',
        '#a855f7':'紫＝もう一回'
      }[color] || '—';
      resultEl.textContent = `結果：${label}`;
    }

    // ===== イベント =====
    document.getElementById('btnSpin').addEventListener('click', () => {
      resetBalls();
      pickResult();
      if (!spinning) { spinning = true; step(); }
      // 数秒後に止める
      clearTimeout(window._stopT);
      window._stopT = setTimeout(()=>{ spinning=false; }, 2600);
    }, { passive: true });

    // 初期化
    fitCanvas();
    resetBalls();
    draw();
  </script>
</body>
</html>
